[project]
name = "travel"
version = "0.1.0"
description = "A private, conversation-driven travel planner."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.79",
    "claude-agent-sdk>=0.2.153",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-openai>=0.3.29",
    "psycopg[binary,pool]>=3.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "reportlab>=4.2",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.30",
    "XlsxWriter>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_api"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]
