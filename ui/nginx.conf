server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Vite's build hashes JS/CSS filenames, so those are safe to cache
  # indefinitely — but index.html references those hashes by name, so it must
  # never be served stale, or a browser can keep running an old bundle after
  # every deploy without any visible sign that it's out of date.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Itinerary generation runs planner and validator agents sequentially.  The
  # default 60-second Nginx read timeout can expire while that work is validly
  # still in progress, resulting in an otherwise misleading 504 page.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
