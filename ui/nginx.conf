server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  location / { try_files $uri $uri/ /index.html; }
  # Itinerary generation runs planner and validator agents sequentially.  The
  # default 60-second Nginx read timeout can expire while that work is validly
  # still in progress, resulting in an otherwise misleading 504 page.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
